<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cierre de Stock · Cheesequeria</title>
<style>
  :root{
    --amber:#E8A33D; --amber-dk:#C9821B; --slate:#2B3445; --slate-2:#3C4659;
    --cream:#FAF6EE; --card:#FFFFFF; --line:#E7DECB; --muted:#8A8270;
    --good:#3F8F5B; --good-bg:#E7F3EB; --bad:#C6484A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:var(--cream); color:var(--slate);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding-bottom:60px;}
  header{position:sticky; top:0; z-index:30; background:var(--slate); color:#fff;
    padding:12px 16px; box-shadow:0 2px 12px rgba(0,0,0,.18);}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--amber);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--slate);font-size:15px;}
  .brand h1{font-size:16px; margin:0; font-weight:700; letter-spacing:.3px;}
  .ctrls{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .seg{display:flex; background:var(--slate-2); border-radius:10px; padding:3px; gap:3px;}
  .seg button{border:0; background:transparent; color:#C9D0DD; font-weight:600;
    padding:8px 14px; border-radius:8px; font-size:13px;}
  .seg button.on{background:var(--amber); color:var(--slate);}
  input[type=date], input[type=text]{background:var(--slate-2); border:0; color:#fff; padding:8px 10px;
    border-radius:8px; font-size:13px; font-weight:600;}

  .wrap{max-width:1100px; margin:0 auto; padding:14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px;}
  .card h2{font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  .step-badge{width:22px;height:22px;border-radius:50%;background:var(--amber);color:var(--slate);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}

  .grp-title{font-weight:700; font-size:13px; color:var(--amber-dk); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.4px;}
  .rowline{display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid var(--line);}
  .rowline:last-child{border-bottom:none;}
  .rowline label{flex:1; font-size:13.5px;}
  .numbox{width:56px; text-align:center; padding:8px 4px; border-radius:8px; border:1px solid var(--line);
    font-size:15px; font-weight:700; background:#fff;}
  .numbox.tarta{background:#FFF6E8;}
  .collabel{width:56px; text-align:center; font-size:10px; color:var(--muted); font-weight:700;}

  textarea{width:100%; min-height:160px; border-radius:10px; border:1px solid var(--line); padding:10px;
    font-family:ui-monospace,Menlo,monospace; font-size:11px; resize:vertical;}

  .btn{border:0; border-radius:10px; padding:12px 18px; font-weight:700; font-size:14px; cursor:pointer;}
  .btn-primary{background:var(--amber); color:var(--slate);}
  .btn-primary:active{background:var(--amber-dk);}
  .btn-outline{background:#fff; border:1px solid var(--line); color:var(--slate);}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}

  .parsedbox{margin-top:10px; font-size:12px; color:var(--muted); max-height:140px; overflow:auto;
    background:#FBFAF6; border:1px dashed var(--line); border-radius:8px; padding:8px;}
  .parsedbox b{color:var(--slate);}
  .unmatched{color:var(--bad); font-weight:600;}

  /* ===== REPORT (matches paper ficha) ===== */
  #report{background:#fff; padding:24px; width:1300px; color:#1a1a1a; font-family:Arial,Helvetica,sans-serif;}
  #report .header-row{display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:8px; min-height:66px;}
  #report .rlogo{position:absolute; left:0; top:0; width:62px; height:auto;}
  #report h1{text-align:center; font-size:32px; margin:0; letter-spacing:1px;}
  #report .meta{display:flex; justify-content:space-between; margin-top:16px; font-size:17px;}
  #report .meta div{margin-bottom:6px;}
  #report .turno{display:flex; align-items:center; gap:26px; font-size:17px; margin-top:6px; margin-bottom:12px;}
  #report .box{display:inline-block; width:15px; height:15px; border:2px solid #000; margin-right:6px; vertical-align:middle;}
  #report .box.checked{background:#2e7d32; position:relative;}
  #report .box.checked:after{content:"✓"; color:#fff; font-size:12px; position:absolute; left:1px; top:-3px;}
  #report hr{border:1px solid #000; margin-bottom:18px;}
  #report .columns{display:flex; gap:18px;}
  #report .col-left{flex:1.05;} #report .col-right{flex:1;}
  #report table{width:100%; border-collapse:collapse; margin-bottom:16px; font-size:13px;}
  #report th{background:#e2e2e2; text-align:left; padding:6px 7px; border:1px solid #999; font-size:12px;}
  #report td{padding:5px 7px; border:1px solid #999;}
  #report .cat{font-weight:bold; text-align:center; vertical-align:middle;}
  #report .num{text-align:center; font-weight:bold;}
  #report .agotado{color:#c62828; font-weight:bold; text-align:center;}
  #report .pct{text-align:center; font-weight:bold;}
  #report .up100{color:#c62828;} #report .up50{color:#e65100;} #report .down50{color:#1565c0;} #report .zero{color:#888; font-weight:normal;}
  #report .box-title{background:#e2e2e2; padding:7px; font-weight:bold; border:1px solid #999; border-bottom:none;}
  #report .box-body{border:1px solid #999; padding:8px 12px; margin-bottom:14px;}
  #report .box-body div{display:flex; justify-content:space-between; padding:3px 0; font-size:13px;}
  #report .note{background:#fff8e1; border:1px solid #f9a825; padding:8px 12px; font-size:12px; margin-top:8px; border-radius:4px;}

  #reportPreviewWrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; margin-top:12px;}
  .hidden{display:none;}
  .toggle-row{display:flex; align-items:center; gap:8px; font-size:13px; margin-top:8px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">CQ</div>
    <h1>Cierre de Stock · Cheesequeria</h1>
  </div>
  <div class="ctrls">
    <input type="date" id="fecha">
    <div class="seg" id="tiendaSeg">
      <button data-v="MIRAMAR" class="on">Miramar</button>
      <button data-v="FUENGIROLA">Fuengirola</button>
    </div>
    <div class="seg" id="turnoSeg">
      <button data-v="MAÑANA" class="on">Mañana</button>
      <button data-v="TARDE">Tarde</button>
    </div>
    <input type="text" id="persona" placeholder="Persona" style="width:110px;">
  </div>
</header>

<div class="wrap">

  <div class="card">
    <h2><span class="step-badge">1</span> Stock inicial (lo que ya contaste)</h2>
    <div id="stockInicialForm"></div>
  </div>

  <div class="card">
    <h2><span class="step-badge">2</span> Pegá el export de ventas del día</h2>
    <p style="font-size:12px;color:var(--muted);margin:0 0 8px;">Copiá y pegá el bloque "Producto / Precio unitario / Cantidad" del PDF de ventas (podés pegar todo el documento entero, la app busca sola las líneas que le sirven).</p>
    <textarea id="ventasInput" placeholder="Pegá acá el texto del export..."></textarea>
    <div class="btnrow">
      <button class="btn btn-primary" id="btnCalcular">Calcular stock final →</button>
    </div>
    <div id="parsedInfo" class="parsedbox hidden"></div>
  </div>

  <div class="card" id="reportCard" style="display:none;">
    <h2><span class="step-badge">3</span> Ficha final</h2>
    <div class="toggle-row">
      <input type="checkbox" id="showAgotado">
      <label for="showAgotado">Mostrar "AGOTADO" en vez de 0 cuando se vendió de más</label>
    </div>
    <div id="reportPreviewWrap">
      <div id="report"></div>
    </div>
    <div class="btnrow">
      <button class="btn btn-primary" id="btnDescargar">📥 Descargar imagen JPG</button>
      <button class="btn btn-outline" id="btnRecalcular">🔄 Volver a calcular</button>
    </div>
  </div>

</div>

<script>
/* ================== DATOS MAESTROS ================== */
const SECTIONS = {
  tradicio: {label:'TRADICIO', items:[
    {k:'tradicional', label:'Tradicional', tarta:true},
    {k:'limon', label:'Limón', tarta:false},
    {k:'carapino', label:'Carapino', tarta:false},
    {k:'payoyo', label:'Payoyo', tarta:false},
    {k:'idiazabal', label:'Idiazábal', tarta:false},
    {k:'delavina', label:'De la viña', tarta:true},
    {k:'pistacho', label:'Pistacho', tarta:true},
    {k:'kinder', label:'Kinder', tarta:true},
  ]},
  filipinos: {label:'FILIPINOS', items:[
    {k:'filipinos', label:'Filipinos', tarta:true},
    {k:'oreo', label:'Oreo', tarta:false},
    {k:'milkybar', label:'Milkybar', tarta:false},
    {k:'chipsahoy', label:'Chips Ahoy', tarta:false},
  ]},
  milk: {label:'MILK', items:[
    {k:'lotus', label:'Lotus', tarta:false},
    {k:'milkaoreo', label:'Milka Oreo', tarta:true},
    {k:'kitkat', label:'Kit Kat', tarta:false},
  ]},
  variados: {label:'VARIADOS', items:[
    {k:'frambuesas', label:'Tradicional con frambuesas', tarta:false},
    {k:'galletalimon', label:'Galleta limón', tarta:false},
    {k:'phoskitos', label:'Phoskitos', tarta:false},
    {k:'mango', label:'Mango', tarta:false},
    {k:'happyhippo', label:'Happy Hippo', tarta:true},
    {k:'dulcedeleche', label:'Dulce de leche', tarta:true},
    {k:'tartadelmes', label:'Tarta del mes', tarta:false},
  ]}
};
const TARRINAS = [{k:'pistacho',label:'Pistacho'},{k:'kinder',label:'Kinder'},{k:'chocoblanc',label:'Choco Blanc'}];
const COOKIE = [
  {k:'doschocolates',label:'Dos chocolates'},{k:'negrachocoblanco',label:'Negra chocolate blanco'},
  {k:'lotus',label:'Lotus'},{k:'pistacho',label:'Pistacho'},{k:'kinder',label:'Kinder'},
  {k:'oreo',label:'Oreo'},{k:'twix',label:'Twix'},{k:'filipinosblancos',label:'Filipinos blancos'},
  {k:'dubai',label:'Dubai'},{k:'zanahoria',label:'Zanahoria'},{k:'redvelvet',label:'Red velvet'},
  {k:'rafaello',label:'Rafaello'},{k:'panterarosa',label:'Pantera rosa'},{k:'banana',label:'Banana'},
  {k:'chocobom',label:'Choco bom'},{k:'kitkat',label:'Kit kat'},{k:'dulcedeleche',label:'Dulce de leche'}
];
const TARTAPEQ = [{k:'payoya',label:'Payoya'},{k:'filipino',label:'Filipino'},{k:'tradicional',label:'Tradicional'},{k:'pistacho',label:'Pistacho'},{k:'suchard',label:'Suchard'},{k:'rafaello',label:'Rafaello'},{k:'ferrero',label:'Ferrero'},{k:'turron',label:'Turrón'},{k:'lacasitos',label:'LACASITOS'}];
const TARTAMINI = [{k:'payoya',label:'Payoya'},{k:'filipino',label:'Filipino'},{k:'tradicional',label:'Tradicional'},{k:'pistacho',label:'Pistacho'},{k:'suchard',label:'Suchard'},{k:'rafaello',label:'Rafaello'},{k:'ferrero',label:'Ferrero'},{k:'turron',label:'Turrón'},{k:'lacasitos',label:'LACASITOS'}];
/* Panettones: 4 sabores x 2 tamaños */
const PANETTONES = [];
[['pistacho','Pistacho'],['kinder','Kinder'],['lotus','Lotus'],['tradicional','Tradicional']].forEach(([k,l])=>{
  PANETTONES.push({k:k+'_grande', label:l+' grande'});
  PANETTONES.push({k:k+'_mediano', label:l+' mediano'});
});

/* Mapeo nombre de producto normalizado -> [seccion, key] para PORCION */
const PORCION_MAP = [
  ['TRADICIONAL CON FRAMBUESAS',['variados','frambuesas']],
  ['GALLETA LIMON',['variados','galletalimon']],
  ['TRADICIONAL',['tradicio','tradicional']],
  ['LIMON',['tradicio','limon']],
  ['CARAPINO',['tradicio','carapino']],
  ['PAYOYO',['tradicio','payoyo']],
  ['IDIAZABAL',['tradicio','idiazabal']],
  ['DE LA VINA',['tradicio','delavina']],
  ['PISTACHO',['tradicio','pistacho']],
  ['KINDER',['tradicio','kinder']],
  ['FILIPINOS BLANCOS',null], // no existe como porcion, evita colision
  ['FILIPINOS',['filipinos','filipinos']],
  ['MILKYBAR',['filipinos','milkybar']],
  ['CHIPS AHOY',['filipinos','chipsahoy']],
  ['MILKA CON OREO',['milk','milkaoreo']],
  ['LOTUS',['milk','lotus']],
  ['KIT KAT',['milk','kitkat']],
  ['PHOSKITOS',['variados','phoskitos']],
  ['MANGO',['variados','mango']],
  ['HAPPY HIPPO',['variados','happyhippo']],
  ['DULCE DE LECHE',['variados','dulcedeleche']],
  ['TARTA DEL MES',['variados','tartadelmes']],
  ['OREO',['filipinos','oreo']],
];
const COOKIE_MAP = [
  ['DOS CHOCOLATES','doschocolates'],['NEGRA CHOCOLATE BLANCO','negrachocoblanco'],
  ['FILIPINOS BLANCOS','filipinosblancos'],['LOTUS','lotus'],['PISTACHO','pistacho'],
  ['KINDER','kinder'],['OREO','oreo'],['TWIX','twix'],['DUBAI','dubai'],
  ['ZANAHORIA','zanahoria'],['RED VELVET','redvelvet'],['RAFAELLO','rafaello'],
  ['PANTERA ROSA','panterarosa'],['BANANA','banana'],['CHOCOBOM','chocobom'],
  ['KIT KAT','kitkat'],['DULCE DE LECHE','dulcedeleche'],
];
const TARTAGRANDE_MAP = [
  ['TRADICIONAL',['tradicio','tradicional']],['PISTACHO',['tradicio','pistacho']],
  ['KINDER',['tradicio','kinder']],['FILIPINOS',['filipinos','filipinos']],
  ['DULCE DE LECHE',['variados','dulcedeleche']],['DE LA VINA',['tradicio','delavina']],
  ['MILKA CON OREO',['milk','milkaoreo']],['HAPPY HIPPO',['variados','happyhippo']],
];
const TARTAPEQ_MAP = [
  ['LACASITOS','lacasitos'],['PISTACHO','pistacho'],['PAYOYA','payoya'],
  ['PAYOYO','payoya'],['FILIPINO','filipino'],['TRADICIONAL','tradicional'],
  ['SUCHARD','suchard'],['RAFFAELLO','rafaello'],['RAFAELLO','rafaello'],['RAFAELO','rafaello'],
  ['FERRERO','ferrero'],['TURRON','turron'],
];
const PANETTON_SABORES = [['PISTACHO','pistacho'],['KINDER','kinder'],['LOTUS','lotus'],['TRADICIONAL','tradicional']];

function normalize(s){
  return s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[!¡]/g,'').replace(/\s+/g,' ').trim();
}
function matchMap(name, map){
  for(const [pat, val] of map){ if(name === pat) return val; }
  for(const [pat, val] of map){ if(name.includes(pat)) return val; }
  return null;
}

/* ================== STATE ================== */
let state = { tradicio:{}, filipinos:{}, milk:{}, variados:{}, tarrinas:{}, cookie:{}, tartapeq:{}, tartamini:{}, panettones:{} };
function initState(){
  for(const sec in SECTIONS){ SECTIONS[sec].items.forEach(it=>{ state[sec][it.k] = {porcion:0, tarta:0}; }); }
  TARRINAS.forEach(it=> state.tarrinas[it.k]=0);
  COOKIE.forEach(it=> state.cookie[it.k]=0);
  TARTAPEQ.forEach(it=> state.tartapeq[it.k]=0);
  TARTAMINI.forEach(it=> state.tartamini[it.k]=0);
  PANETTONES.forEach(it=> state.panettones[it.k]=0);
}
initState();

/* ================== BUILD FORM (paso 1) ================== */
function buildForm(){
  const root = document.getElementById('stockInicialForm');
  root.innerHTML = '';
  for(const sec in SECTIONS){
    const g = document.createElement('div');
    g.innerHTML = `<div class="grp-title">${SECTIONS[sec].label}</div>`;
    const head = document.createElement('div');
    head.className='rowline';
    head.innerHTML = `<label></label><div class="collabel">PORC.</div><div class="collabel">TARTA</div>`;
    g.appendChild(head);
    SECTIONS[sec].items.forEach(it=>{
      const row = document.createElement('div'); row.className='rowline';
      row.innerHTML = `<label>${it.label}</label>
        <input class="numbox" type="number" min="0" inputmode="numeric" data-sec="${sec}" data-k="${it.k}" data-f="porcion" value="0">
        <input class="numbox tarta" type="number" min="0" inputmode="numeric" data-sec="${sec}" data-k="${it.k}" data-f="tarta" value="0" ${it.tarta?'':'disabled style="opacity:.25"'}>`;
      g.appendChild(row);
    });
    root.appendChild(g);
  }
  // Tarrinas
  let g = document.createElement('div'); g.innerHTML = `<div class="grp-title">Tarrinas</div>`;
  TARRINAS.forEach(it=>{
    const row = document.createElement('div'); row.className='rowline';
    row.innerHTML = `<label>${it.label}</label><input class="numbox" type="number" min="0" inputmode="numeric" data-grp="tarrinas" data-k="${it.k}" value="0"><div class="collabel"></div>`;
    g.appendChild(row);
  });
  root.appendChild(g);
  // Cookie
  g = document.createElement('div'); g.innerHTML = `<div class="grp-title">Cookie</div>`;
  COOKIE.forEach(it=>{
    const row = document.createElement('div'); row.className='rowline';
    row.innerHTML = `<label>${it.label}</label><input class="numbox" type="number" min="0" inputmode="numeric" data-grp="cookie" data-k="${it.k}" value="0"><div class="collabel"></div>`;
    g.appendChild(row);
  });
  root.appendChild(g);
  // Tarta pequeña
  g = document.createElement('div'); g.innerHTML = `<div class="grp-title">Tarta pequeña</div>`;
  TARTAPEQ.forEach(it=>{
    const row = document.createElement('div'); row.className='rowline';
    row.innerHTML = `<label>${it.label}</label><input class="numbox" type="number" min="0" inputmode="numeric" data-grp="tartapeq" data-k="${it.k}" value="0"><div class="collabel"></div>`;
    g.appendChild(row);
  });
  root.appendChild(g);
  // Tarta mini
  g = document.createElement('div'); g.innerHTML = `<div class="grp-title">Tarta mini</div>`;
  TARTAMINI.forEach(it=>{
    const row = document.createElement('div'); row.className='rowline';
    row.innerHTML = `<label>${it.label}</label><input class="numbox" type="number" min="0" inputmode="numeric" data-grp="tartamini" data-k="${it.k}" value="0"><div class="collabel"></div>`;
    g.appendChild(row);
  });
  root.appendChild(g);
  // Panettones
  g = document.createElement('div'); g.innerHTML = `<div class="grp-title">Panettones</div>`;
  PANETTONES.forEach(it=>{
    const row = document.createElement('div'); row.className='rowline';
    row.innerHTML = `<label>${it.label}</label><input class="numbox" type="number" min="0" inputmode="numeric" data-grp="panettones" data-k="${it.k}" value="0"><div class="collabel"></div>`;
    g.appendChild(row);
  });
  root.appendChild(g);

  root.querySelectorAll('input[data-sec]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const sec=inp.dataset.sec, k=inp.dataset.k, f=inp.dataset.f;
      state[sec][k][f] = parseInt(inp.value||'0',10)||0;
    });
  });
  root.querySelectorAll('input[data-grp]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const grp=inp.dataset.grp, k=inp.dataset.k;
      state[grp][k] = parseInt(inp.value||'0',10)||0;
    });
  });
}
buildForm();

/* ================== HEADER CONTROLS ================== */
document.getElementById('fecha').value = new Date().toISOString().slice(0,10);
function wireSeg(id){
  const seg = document.getElementById(id);
  seg.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
    });
  });
}
wireSeg('tiendaSeg'); wireSeg('turnoSeg');

/* ================== PARSER DE VENTAS ================== */
function parseLine(line){
  const parens = [...line.matchAll(/\(([^)]+)\)/g)];
  if(!parens.length) return null;
  const tag = normalize(parens[parens.length-1][1]);
  const lastParenIdx = line.lastIndexOf('(');
  if(lastParenIdx < 0) return null;
  let namePart = line.substring(0, lastParenIdx);
  namePart = namePart.replace(/^(PORCION TARTAS|GALLETAS|TARTAS LUXURY\s*\(NUEVO\)|TARTAS LUXURY|TARTAS GRANDES|BEBIDAS|LATAS|CAFE)\s*/i,'');
  namePart = namePart.replace(/\(NUEVO\)\s*/i,'');
  const name = normalize(namePart);
  if(!name) return null;
  const tokens = line.trim().split(/\s+/);
  const lastTok = tokens[tokens.length-1];
  const qty = parseInt(lastTok.replace(/[^\d]/g,''),10);
  if(isNaN(qty) || qty<=0 || qty>50) return null;
  return {name, tag, qty};
}

function parseVentas(text){
  const lines = text.split('\n');
  const sold = { porcion:{}, tarta:{}, cookie:{}, tartapeq:{}, tartamini:{}, panettones:{} };
  const unmatched = [];
  let matchedCount = 0;
  lines.forEach(line=>{
    // Panettones: se detectan por nombre (sabor + tamaño), con o sin paréntesis
    const nline = normalize(line);
    if(nline.includes('PANETTON')){
      const toks = line.trim().split(/\s+/);
      const q = parseInt(toks[toks.length-1].replace(/[^\d]/g,''),10);
      if(isNaN(q) || q<=0 || q>50) return;
      const size = nline.includes('GRANDE') ? 'grande' : (nline.includes('MEDIAN') ? 'mediano' : null);
      const sab = PANETTON_SABORES.find(([pat])=> nline.includes(pat));
      if(size && sab){ const key = sab[1]+'_'+size; sold.panettones[key] = (sold.panettones[key]||0)+q; matchedCount++; }
      else unmatched.push(`PANETTONE: ${nline.slice(0,60)} (x${q})`);
      return;
    }
    const p = parseLine(line);
    if(!p) return;
    if(p.tag === 'PORCION'){
      const m = matchMap(p.name, PORCION_MAP);
      if(m){ const key = m[0]+'.'+m[1]; sold.porcion[key] = (sold.porcion[key]||0)+p.qty; matchedCount++; }
      else unmatched.push(`PORCION: ${p.name} (x${p.qty})`);
    } else if(p.tag === 'COOKIE'){
      const m = matchMap(p.name, COOKIE_MAP);
      if(m){ sold.cookie[m] = (sold.cookie[m]||0)+p.qty; matchedCount++; }
      else unmatched.push(`COOKIE: ${p.name} (x${p.qty})`);
    } else if(p.tag === 'TARTA GRANDE'){
      const m = matchMap(p.name, TARTAGRANDE_MAP);
      if(m){ const key = m[0]+'.'+m[1]; sold.tarta[key] = (sold.tarta[key]||0)+p.qty; matchedCount++; }
      else unmatched.push(`TARTA GRANDE: ${p.name} (x${p.qty})`);
    } else if(p.tag === 'TARTA PEQUENA' || p.tag === 'TARTA PEQUEÑA'){
      const m = matchMap(p.name, TARTAPEQ_MAP);
      if(m){ sold.tartapeq[m] = (sold.tartapeq[m]||0)+p.qty; matchedCount++; }
      else unmatched.push(`TARTA PEQUEÑA: ${p.name} (x${p.qty})`);
    } else if(p.tag === 'TARTA MINI'){
      const m = matchMap(p.name, TARTAPEQ_MAP);
      if(m){ sold.tartamini[m] = (sold.tartamini[m]||0)+p.qty; matchedCount++; }
      else unmatched.push(`TARTA MINI: ${p.name} (x${p.qty})`);
    }
    // LATAS / BEBIDAS / CAFE / MERMA misc -> se ignoran (no son stock de tartas)
  });
  return {sold, unmatched, matchedCount};
}

/* ================== CALCULO % PEDIDO ================== */
function calcPed(final, sold){
  if(final<=0 && sold>0) return {cls:'up100', txt:'+100%'};
  if(sold>0 && final>0 && final <= Math.ceil(sold/2)) return {cls:'up50', txt:'+50%'};
  if(sold===0 && final>=2) return {cls:'down50', txt:'-50%'};
  return {cls:'zero', txt:'0%'};
}

let lastCalc = null;

document.getElementById('btnCalcular').addEventListener('click', ()=>{
  const text = document.getElementById('ventasInput').value;
  const {sold, unmatched, matchedCount} = parseVentas(text);

  // calcular finales
  const finalState = JSON.parse(JSON.stringify(state));
  for(const sec in SECTIONS){
    SECTIONS[sec].items.forEach(it=>{
      const key = sec+'.'+it.k;
      const soldP = sold.porcion[key]||0;
      const soldT = sold.tarta[key]||0;
      finalState[sec][it.k]._soldPorcion = soldP;
      finalState[sec][it.k]._soldTarta = soldT;
      finalState[sec][it.k].porcion = Math.max(0, finalState[sec][it.k].porcion - soldP);
      finalState[sec][it.k].tarta = Math.max(0, finalState[sec][it.k].tarta - soldT);
    });
  }
  const cookieSold = {};
  COOKIE.forEach(it=>{
    const s = sold.cookie[it.k]||0;
    cookieSold[it.k]=s;
    finalState.cookie[it.k] = Math.max(0, finalState.cookie[it.k]-s);
  });
  const tartapeqSold = {};
  TARTAPEQ.forEach(it=>{
    const s = sold.tartapeq[it.k]||0;
    tartapeqSold[it.k]=s;
    finalState.tartapeq[it.k] = Math.max(0, finalState.tartapeq[it.k]-s);
  });
  const tartaminiSold = {};
  TARTAMINI.forEach(it=>{
    const s = sold.tartamini[it.k]||0;
    tartaminiSold[it.k]=s;
    finalState.tartamini[it.k] = Math.max(0, finalState.tartamini[it.k]-s);
  });

  const panettonesSold = {};
  PANETTONES.forEach(it=>{
    const s = sold.panettones[it.k]||0;
    panettonesSold[it.k]=s;
    finalState.panettones[it.k] = Math.max(0, finalState.panettones[it.k]-s);
  });

  lastCalc = {finalState, cookieSold, tartapeqSold, tartaminiSold, panettonesSold, sold, unmatched, matchedCount};

  // mostrar info parseo
  const infoBox = document.getElementById('parsedInfo');
  infoBox.classList.remove('hidden');
  let html = `<b>${matchedCount} líneas de venta reconocidas.</b>`;
  if(unmatched.length){
    html += `<br><span class="unmatched">${unmatched.length} líneas no reconocidas (no afectan el stock, revisalas si son relevantes):</span><br>` + unmatched.slice(0,25).join('<br>');
  }
  infoBox.innerHTML = html;

  renderReport();
  document.getElementById('reportCard').style.display='block';
  document.getElementById('reportCard').scrollIntoView({behavior:'smooth'});
});

document.getElementById('btnRecalcular').addEventListener('click', ()=>{
  document.getElementById('reportCard').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
});

function pill(final, soldQty, showAgotado){
  if(final<=0 && soldQty>0 && showAgotado) return `<span class="agotado">AGOTADO</span>`;
  return `<span class="num">${final}</span>`;
}

/* ================== DESCARGA JPG ================== */
document.getElementById('btnDescargar').addEventListener('click', ()=>{
  const el = document.getElementById('report');
  html2canvas(el, {scale:2, backgroundColor:'#ffffff'}).then(canvas=>{
    const link = document.createElement('a');
    const tienda = document.querySelector('#tiendaSeg button.on').dataset.v;
    const turno = document.querySelector('#turnoSeg button.on').dataset.v;
    const fecha = document.getElementById('fecha').value;
    link.download = `ficha-stock-${tienda}-${turno}-${fecha}.jpg`;
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  });
});
